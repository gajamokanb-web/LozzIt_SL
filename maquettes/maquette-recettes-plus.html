.lead{color:var(--muted);margin:0 0 14px;max-width:70ch;font-size:13px}
.toggle{margin:10px 0;display:flex;gap:8px;flex-wrap:wrap}
.toggle button{font:600 12px var(--body);color:var(--muted);background:none;border:1px solid var(--edge);border-radius:4px;padding:8px 12px;cursor:pointer}
.toggle button[aria-pressed=true]{background:var(--btn);border-color:var(--glow);color:var(--ink)}
